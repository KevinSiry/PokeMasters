# Services locaux de PokeFlex. Lancer : npm run db:up (ou docker compose up -d)
name: pokeflex

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pokeflex
      POSTGRES_PASSWORD: pokeflex
      POSTGRES_DB: pokeflex
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokeflex -d pokeflex"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg-data:
  redis-data:
