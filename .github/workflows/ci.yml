name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build (Linux)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pokeflex
          POSTGRES_PASSWORD: pokeflex
          POSTGRES_DB: pokeflex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pokeflex" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://pokeflex:pokeflex@localhost:5432/pokeflex?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-secret-not-used-in-production
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate --schema packages/db/prisma/schema.prisma
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Registre des Jetons cohérent après les tests
        run: npm run audit:ledger
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  windows:
    name: Installation et tests unitaires (Windows)
    runs-on: windows-latest
    env:
      SKIP_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Docker Compose (jeu complet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker compose build
      - name: Lancer le jeu et vérifier qu'il répond
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/connexion; then break; fi
            sleep 3
          done
          curl -fsS http://localhost:3000/connexion | grep -q "demo-collection"
          curl -fsS -o /dev/null http://localhost:3000/marche
          curl -fsS -o /dev/null "http://localhost:3001/socket.io/?EIO=4&transport=polling"
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs
